<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>數學單元測試</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #101418;
      color: #e6e9ec;
      font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    .pass { color: #7ee787; }
    .fail { color: #ff7b72; }
    li { margin: 4px 0; }
  </style>
</head>
<body>
  <h1>數學單元測試</h1>
  <p id="summary"></p>
  <ul id="results"></ul>

  <script src="../js/dft.js"></script>
  <script src="../js/path.js"></script>
  <script src="tests.js"></script>
  <script>
    // 網址加上 ?filter=關鍵字 可只跑部分測試
    const filter = new URLSearchParams(location.search).get('filter') || '';
    const results = runTests(filter);
    const list = document.getElementById('results');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'pass' : 'fail';
      li.textContent = formatResult(r);
      list.appendChild(li);
    }
    const summary = document.getElementById('summary');
    summary.textContent = summarize(results);
    summary.className = results.every((r) => r.ok) ? 'pass' : 'fail';
  </script>
</body>
</html>
