<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>傅立葉畫圖機</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>傅立葉畫圖機</h1>
    <canvas id="board" aria-label="繪圖畫布"></canvas>
    <p id="message" class="message">在畫布上畫一條封閉曲線（放開時會自動閉合）</p>
    <div class="controls">
      <label class="slider">
        <span>圓圈數量：<output id="count-label">—</output></span>
        <input id="count" type="range" min="1" max="511" step="1" value="511" disabled>
      </label>
      <button id="clear" type="button">清除重畫</button>
    </div>
  </main>

  <!-- 依相依順序載入：數學 → 軌跡 → 繪圖 → 輸入 → 主程式 -->
  <script src="js/dft.js"></script>
  <script src="js/path.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
